<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quiz results — redesign mockup (scales to 200)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        bg:'var(--bg)', card:'var(--card)', fg:'var(--fg)', muted:'var(--muted)',
        'muted-fg':'var(--muted-fg)', primary:'var(--primary)', 'primary-fg':'var(--primary-fg)',
        destructive:'var(--destructive)', line:'var(--border)',
      },
    }},
  }
</script>
<style>
  :root{
    --bg: oklch(0.145 0 0);
    --card: oklch(0.205 0 0);
    --fg: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-fg: oklch(0.708 0 0);
    --primary: oklch(0.80 0.13 82);
    --primary-fg: oklch(0.20 0.06 82);
    --destructive: oklch(0.70 0.19 22);
    --border: oklch(1 0 0 / 10%);
    --emerald: #34d399;
    --emerald-dim: color-mix(in oklch, #34d399 14%, transparent);
    --rose-dim: color-mix(in oklch, oklch(0.70 0.19 22) 14%, transparent);
  }
  *{ font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body{ background:var(--bg); color:var(--fg); }
  .ring1{ box-shadow: inset 0 0 0 1px var(--border); }
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 9px; border-radius:9999px; line-height:1.5; white-space:nowrap; }
  .icn{ width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round; }
  .icn-sm{ width:13px;height:13px; }
  .seg{ font-size:13px; font-weight:500; padding:5px 12px; border-radius:9999px; color:var(--muted-fg); cursor:pointer; transition:all .12s ease; }
  .seg[data-active="true"]{ background:var(--card); color:var(--fg); box-shadow: inset 0 0 0 1px var(--border); }
  .cell{ display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;transition:transform .08s ease,outline-color .1s ease; outline:2px solid transparent; outline-offset:1px; }
  .cell:hover{ transform:translateY(-2px); }
  .cell.focus-cell{ outline-color: var(--fg); }
  .item-detail{ display:none; }
  .item[data-open="true"] .item-detail{ display:block; }
  .item[data-open="true"] .chev{ transform:rotate(90deg); }
  .chev{ transition:transform .15s ease; }
  .item.hide{ display:none; }
  .sizebtn{ font-size:12px;font-weight:600;padding:4px 10px;border-radius:9999px;cursor:pointer;color:var(--muted-fg); }
  .sizebtn[data-active="true"]{ background:var(--primary);color:var(--primary-fg); }
</style>
</head>
<body class="min-h-screen">

<header class="h-14 border-b border-line flex items-center px-5 gap-3 sticky top-0 z-30" style="background:color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter:blur(8px)">
  <div class="text-sm text-muted-fg flex items-center gap-2">
    <span>Quiz</span><span class="opacity-40">›</span><span>Session</span><span class="opacity-40">›</span>
    <span class="text-fg font-medium">Results</span>
  </div>
  <div class="ml-auto flex items-center gap-2">
    <span class="text-xs text-muted-fg mr-1">Demo size:</span>
    <div class="inline-flex items-center gap-1 rounded-full bg-muted/40 p-1">
      <button class="sizebtn" data-size="6" onclick="setSize(6)">6</button>
      <button class="sizebtn" data-size="60" data-active="true" onclick="setSize(60)">60</button>
      <button class="sizebtn" data-size="200" onclick="setSize(200)">200</button>
    </div>
  </div>
</header>

<div class="mx-auto w-full max-w-2xl px-4 py-6 space-y-5">

  <!-- ============ HERO SUMMARY ============ -->
  <section class="rounded-2xl border border-line bg-card p-6">
    <div class="flex flex-col items-center gap-6 sm:flex-row sm:items-center sm:text-left">
      <div class="relative h-28 w-28 shrink-0">
        <svg class="h-full w-full -rotate-90" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke-width="9" style="stroke:var(--muted)"/>
          <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke-width="9" stroke-linecap="round" style="stroke:var(--primary)"/>
        </svg>
        <div class="absolute inset-0 flex items-center justify-center">
          <span id="ringPct" class="text-3xl font-bold tabular-nums" style="color:var(--primary)">—</span>
        </div>
      </div>
      <div class="flex-1 text-center sm:text-left">
        <h1 class="text-xl font-semibold">Session complete</h1>
        <p id="subline" class="mt-0.5 text-sm text-muted-fg">—</p>
        <div id="heroChips" class="mt-3 flex flex-wrap items-center justify-center gap-2 sm:justify-start"></div>
      </div>
      <div class="flex w-full shrink-0 gap-2 sm:w-auto sm:flex-col">
        <button class="flex-1 rounded-full px-4 py-2 text-sm font-semibold" style="background:var(--primary);color:var(--primary-fg)">Practice again</button>
        <button class="flex-1 rounded-full px-4 py-2 text-sm font-medium ring1 hover:bg-card">View history</button>
      </div>
    </div>
  </section>

  <!-- ============ BREAKDOWN BY DIFFICULTY (scales: a chart, not 200 rows) ============ -->
  <section class="rounded-2xl border border-line bg-card p-5">
    <p class="mb-3 text-xs font-semibold uppercase tracking-wide text-muted-fg">Accuracy by difficulty</p>
    <div id="breakdown" class="space-y-3"></div>
  </section>

  <!-- ============ ANSWER GRID (the scalable overview / navigator) ============ -->
  <section class="rounded-2xl border border-line bg-card p-5">
    <div class="mb-3 flex items-center justify-between">
      <p class="text-xs font-semibold uppercase tracking-wide text-muted-fg">Answer sheet</p>
      <div class="flex items-center gap-3 text-xs text-muted-fg">
        <span class="flex items-center gap-1.5"><span class="inline-block h-3 w-3 rounded" style="background:var(--emerald-dim);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--emerald) 40%,transparent)"></span>Correct</span>
        <span class="flex items-center gap-1.5"><span class="inline-block h-3 w-3 rounded" style="background:var(--rose-dim);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--destructive) 40%,transparent)"></span>Incorrect</span>
      </div>
    </div>
    <div id="grid" class="flex flex-wrap gap-1.5"></div>
    <p class="mt-3 text-xs text-muted-fg">Tap any cell to open that question below.</p>
  </section>

  <!-- ============ REVIEW LIST ============ -->
  <section class="space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h2 class="text-xs font-semibold uppercase tracking-wide text-muted-fg">Review</h2>
      <button id="toggleAll" onclick="toggleAll()" class="text-xs text-muted-fg hover:text-fg">Expand all</button>
    </div>

    <div class="inline-flex items-center gap-1 rounded-full bg-muted/40 p-1">
      <button class="seg" data-filter="all" onclick="setFilter('all')">All <span id="cAll" class="opacity-60"></span></button>
      <button class="seg" data-filter="incorrect" onclick="setFilter('incorrect')">Incorrect <span id="cInc" class="opacity-60"></span></button>
      <button class="seg" data-filter="correct" onclick="setFilter('correct')">Correct <span id="cCor" class="opacity-60"></span></button>
    </div>

    <div id="list" class="space-y-2.5"></div>

    <!-- bounded list: render a window, load more on demand -->
    <div id="loadMoreWrap" class="pt-1 text-center">
      <button id="loadMore" onclick="loadMore()" class="rounded-full px-4 py-2 text-sm font-medium ring1 hover:bg-card"></button>
    </div>
  </section>

  <footer class="pt-2 pb-10 text-center text-xs text-muted-fg">
    Mockup for <span style="font-family:ui-monospace,monospace">QuizResults</span> · switch demo size (top-right) to see it scale
  </footer>
</div>

<script>
  /* ---- real questions used as a content pool ---- */
  const POOL = [
    { diff:'Medium', q:'In the context of the defence of insanity in Ghana, what is the legal significance of an accused person merely exhibiting strange behaviour?',
      opts:[
        {t:'It automatically establishes the defence of insanity.'},
        {t:'It is irrelevant to the defence of insanity.'},
        {t:'It does not automatically establish insanity; the mental disturbance must significantly affect the accused’s capacity to understand the nature or wrongfulness of the act.', correct:true},
        {t:'It shifts the burden of proof to the prosecution to disprove insanity.'},
      ],
      exp:'As clarified in R v Grumah (1959), strange behaviour alone does not establish insanity — the disturbance must significantly affect the accused’s capacity to understand the act or its wrongfulness.' },
    { diff:'Easy', q:'Why does the material identify the initial interview as critical for the lawyer-client relationship?',
      opts:[
        {t:'Because it is the only opportunity for the lawyer to gather facts.'},
        {t:'Because first sessions are difficult to change and influence subsequent interactions.', correct:true},
        {t:'Because it determines the lawyer’s fee for the entire case.'},
        {t:'Because it is where the lawyer must decide whether to report the client to authorities.'},
      ],
      exp:'The material states first sessions are difficult to change and shape later interactions.' },
    { diff:'Medium', q:'What ethical duty does the material identify regarding client communications under the Rules of Professional Conduct for Legal Practitioners 2023?',
      opts:[
        {t:'Lawyers must disclose confidential client information to the court upon request.'},
        {t:'Lawyers are required to maintain confidentiality of client communications.', correct:true},
        {t:'Lawyers may share client information with other lawyers without the client’s consent.'},
        {t:'Confidentiality only applies to communications made outside the law office.'},
      ],
      exp:'The 2023 Rules require confidentiality of client communications.' },
    { diff:'Hard', q:'Under Nigerian law, which of the following is true regarding the capacity to make a will?',
      opts:[
        {t:'Only lawyers can draft wills.'},
        {t:'The testator must have a sound disposing mind at the time of execution.', correct:true},
        {t:'A will must be made voluntarily, but coercion does not affect validity.'},
        {t:'The testator must be at least 21 years old.'},
      ],
      exp:'A will requires a testator of sound disposing mind; non-lawyers may draft wills under s.22(4)(e) LPA, and undue influence does affect validity.' },
    { diff:'Easy', q:'According to the material, which best describes the ‘directive’ and ‘client-centered’ aspects of effective counselling?',
      opts:[
        {t:'They are contradictory, forcing a choice between lawyer control and client control.'},
        {t:'They are complementary, with the lawyer directing legal strategy while the client retains ultimate decision-making authority.', correct:true},
        {t:'The directive aspect is used only when the client is incompetent to decide.'},
        {t:'The client-centered aspect means the lawyer must follow the client’s instructions even if illegal.'},
      ],
      exp:'They are complementary: directive legal expertise plus respect for client autonomy over the ultimate decision.' },
    { diff:'Medium', q:'Which body is primarily responsible for the regulation and discipline of legal practitioners in Nigeria?',
      opts:[
        {t:'The Federal High Court.'},
        {t:'The Legal Practitioners Disciplinary Committee (LPDC).', correct:true},
        {t:'The Nigerian Law School.'},
        {t:'The Ministry of Justice alone.'},
      ],
      exp:'Discipline is handled by the LPDC; courts hear appeals from its decisions.' },
  ];
  const TONE = { Easy:'emerald', Medium:'amber', Hard:'rose' };
  const diffStyle = {
    emerald:'background:var(--emerald-dim);color:var(--emerald)',
    amber:'background:color-mix(in oklch, var(--primary) 16%, transparent);color:var(--primary)',
    rose:'background:var(--rose-dim);color:var(--destructive)',
  };
  const barColor = { emerald:'var(--emerald)', amber:'var(--primary)', rose:'var(--destructive)' };

  /* deterministic "did the user get it right?" pattern (~55% correct) */
  const PATTERN = [true,false,true,true,false,true,false,true,false,true,true,false,false,true,true,false,true,false];
  function buildData(n){
    const out = [];
    for (let i=0;i<n;i++){
      const base = POOL[i % POOL.length];
      const correct = PATTERN[i % PATTERN.length];
      const correctIdx = base.opts.findIndex(o=>o.correct);
      let chosenIdx = correctIdx;
      if (!correct){ chosenIdx = (correctIdx + 1) % base.opts.length; } // pick a wrong one
      out.push({
        n:i+1, correct, chosenIdx, diff:base.diff, tone:TONE[base.diff],
        time:(4 + (i*7)%17) + 's',
        q:base.q, opts:base.opts, exp:base.exp,
        edited: i%17===5,
      });
    }
    return out;
  }

  function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  const CHECK='<svg viewBox="0 0 24 24" class="icn icn-sm"><path d="M20 6 9 17l-5-5"/></svg>';
  const CROSS='<svg viewBox="0 0 24 24" class="icn icn-sm"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  const CLOCK='<svg viewBox="0 0 24 24" class="icn icn-sm"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

  let DATA=[], filter='all', visible=0, PAGE=15;

  function counts(){
    const cor = DATA.filter(d=>d.correct).length;
    return { total:DATA.length, cor, inc:DATA.length-cor };
  }
  function filtered(){
    if (filter==='incorrect') return DATA.filter(d=>!d.correct);
    if (filter==='correct') return DATA.filter(d=>d.correct);
    return DATA;
  }

  function renderHero(){
    const {total,cor,inc} = counts();
    const pct = total ? Math.round(cor/total*100) : 0;
    const r=52,c=2*Math.PI*r, ring=document.getElementById('ring');
    ring.style.strokeDasharray=c; ring.style.strokeDashoffset=c-(pct/100)*c;
    document.getElementById('ringPct').textContent=pct+'%';
    document.getElementById('subline').textContent=`${cor} of ${total} correct · 28 Jun 2026`;
    document.getElementById('heroChips').innerHTML =
      `<span class="badge" style="background:var(--emerald-dim);color:var(--emerald)">${CHECK} ${cor} correct</span>
       <span class="badge" style="background:var(--rose-dim);color:var(--destructive)">${CROSS} ${inc} incorrect</span>
       <span class="badge ring1 text-muted-fg">${CLOCK} ~9s/question</span>`;
  }

  function renderBreakdown(){
    const groups = ['Easy','Medium','Hard'].map(d=>{
      const items = DATA.filter(x=>x.diff===d);
      const cor = items.filter(x=>x.correct).length;
      return { d, tone:TONE[d], total:items.length, cor, pct: items.length? Math.round(cor/items.length*100):0 };
    }).filter(g=>g.total>0);
    document.getElementById('breakdown').innerHTML = groups.map(g=>`
      <div class="flex items-center gap-3">
        <span class="badge w-20 justify-center" style="${diffStyle[g.tone]}">${g.d}</span>
        <div class="h-2 flex-1 overflow-hidden rounded-full" style="background:var(--muted)">
          <div class="h-full rounded-full" style="width:${g.pct}%;background:${barColor[g.tone]}"></div>
        </div>
        <span class="w-20 text-right text-xs tabular-nums text-muted-fg">${g.cor}/${g.total} · ${g.pct}%</span>
      </div>`).join('');
  }

  function renderGrid(){
    const showNum = DATA.length <= 100;
    const size = DATA.length > 120 ? 22 : 28;
    document.getElementById('grid').innerHTML = DATA.map(d=>{
      const style = d.correct
        ? 'background:var(--emerald-dim);color:var(--emerald);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--emerald) 30%,transparent)'
        : 'background:var(--rose-dim);color:var(--destructive);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--destructive) 30%,transparent)';
      return `<button class="cell" data-cell="${d.n}" style="${style};width:${size}px;height:${size}px" title="Q${d.n} — ${d.correct?'correct':'incorrect'}" onclick="openItem(${d.n})">${showNum?d.n:''}</button>`;
    }).join('');
  }

  function optionRow(o, chosen){
    const isCorrect=!!o.correct, isWrong = chosen && !o.correct;
    let icon='<span class="h-5 w-5 shrink-0"></span>', tag='', txtCls='text-muted-fg';
    let box='border:1px solid transparent;background:var(--muted)';
    if (isCorrect){ txtCls='text-fg font-medium'; tag=`<span class="shrink-0 text-xs" style="color:var(--emerald)">Correct answer</span>`;
      icon=`<span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full" style="background:var(--emerald-dim);color:var(--emerald)">${CHECK}</span>`;
      box='border:1px solid color-mix(in oklch,var(--emerald) 30%,transparent);background:var(--emerald-dim)'; }
    else if (isWrong){ txtCls='text-fg font-medium'; tag=`<span class="shrink-0 text-xs" style="color:var(--destructive)">Your answer</span>`;
      icon=`<span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full" style="background:var(--rose-dim);color:var(--destructive)">${CROSS}</span>`;
      box='border:1px solid color-mix(in oklch,var(--destructive) 30%,transparent);background:var(--rose-dim)'; }
    return `<div class="flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm" style="${box}">${icon}<span class="flex-1 ${txtCls}">${esc(o.t)}</span>${tag}</div>`;
  }

  function itemHtml(d){
    const statusStyle=d.correct?'background:var(--emerald-dim);color:var(--emerald)':'background:var(--rose-dim);color:var(--destructive)';
    return `<div class="item rounded-2xl border border-line bg-card" data-id="${d.n}" data-correct="${d.correct}">
      <button class="flex w-full items-center gap-3 p-4 text-left" onclick="toggleItem(${d.n})">
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full" style="${statusStyle}">${d.correct?CHECK:CROSS}</span>
        <span class="min-w-0 flex-1"><span class="line-clamp-2 text-sm font-medium text-fg">${d.n}. ${esc(d.q)}</span></span>
        <span class="badge" style="${diffStyle[d.tone]}">${d.diff}</span>
        <span class="hidden shrink-0 items-center gap-1 text-xs tabular-nums text-muted-fg sm:inline-flex">${CLOCK}${d.time}</span>
        <svg viewBox="0 0 24 24" class="icn chev shrink-0 text-muted-fg"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <div class="item-detail space-y-2 px-4 pb-4">
        ${d.opts.map((o,i)=>optionRow(o, i===d.chosenIdx)).join('')}
        <div class="mt-3 flex gap-2.5 rounded-xl p-3 text-sm text-muted-fg" style="background:color-mix(in oklch, var(--muted) 60%, transparent)">
          <svg viewBox="0 0 24 24" class="icn icn-sm mt-0.5 shrink-0"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
          <p class="leading-relaxed">${esc(d.exp)}</p>
        </div>
        ${d.edited?`<p class="mt-1 flex items-center gap-1.5 text-xs" style="color:var(--primary)"><svg viewBox="0 0 24 24" class="icn icn-sm"><path d="M10.3 3.6 1.8 18a1 1 0 0 0 .9 1.5h18.6a1 1 0 0 0 .9-1.5L13.7 3.6a1 1 0 0 0-1.7 0z"/><path d="M12 9v4M12 17h.01"/></svg>This question was updated after you answered it.</p>`:''}
      </div>
    </div>`;
  }

  function renderList(){
    const set = filtered();
    visible = Math.min(visible || PAGE, set.length);
    document.getElementById('list').innerHTML = set.slice(0, visible).map(itemHtml).join('');
    const wrap=document.getElementById('loadMoreWrap'), btn=document.getElementById('loadMore');
    if (visible < set.length){ wrap.style.display='block'; btn.textContent=`Load more — showing ${visible} of ${set.length}`; }
    else { wrap.style.display='none'; }
    syncToggleAll();
  }
  function loadMore(){ visible += PAGE; renderList(); }

  function setFilter(f){
    filter=f; visible=PAGE;
    document.querySelectorAll('.seg').forEach(s=>s.dataset.active=(s.dataset.filter===f));
    renderList();
  }

  function setSize(n){
    document.querySelectorAll('.sizebtn').forEach(b=>b.dataset.active=(+b.dataset.size===n));
    DATA = buildData(n);
    const {total,cor,inc} = counts();
    document.getElementById('cAll').textContent=total;
    document.getElementById('cInc').textContent=inc;
    document.getElementById('cCor').textContent=cor;
    // large sessions: default to Incorrect (the set you actually review)
    filter = total > 25 ? 'incorrect' : 'all';
    visible = PAGE;
    document.querySelectorAll('.seg').forEach(s=>s.dataset.active=(s.dataset.filter===filter));
    renderHero(); renderBreakdown(); renderGrid(); renderList();
  }

  function toggleItem(n){ const el=document.querySelector(`.item[data-id="${n}"]`); if(el){ el.dataset.open=el.dataset.open!=='true'; syncToggleAll(); } }
  function openItem(n){
    // make sure the item is in the current filter + loaded window, then expand + scroll
    const d = DATA.find(x=>x.n===n);
    if (filter==='incorrect' && d.correct) setFilter('all');
    else if (filter==='correct' && !d.correct) setFilter('all');
    const set = filtered();
    const idx = set.findIndex(x=>x.n===n);
    if (idx >= visible){ visible = idx + 1; renderList(); }
    const el=document.querySelector(`.item[data-id="${n}"]`);
    if (el){ el.dataset.open='true'; el.scrollIntoView({behavior:'smooth',block:'center'});
      document.querySelectorAll('.cell').forEach(c=>c.classList.remove('focus-cell'));
      const cell=document.querySelector(`.cell[data-cell="${n}"]`); if(cell) cell.classList.add('focus-cell');
      syncToggleAll();
    }
  }
  function toggleAll(){
    const shown=[...document.querySelectorAll('.item')];
    const anyClosed=shown.some(el=>el.dataset.open!=='true');
    shown.forEach(el=>el.dataset.open=anyClosed?'true':'false'); syncToggleAll();
  }
  function syncToggleAll(){
    const shown=[...document.querySelectorAll('.item')];
    const anyClosed=shown.some(el=>el.dataset.open!=='true');
    document.getElementById('toggleAll').textContent=anyClosed?'Expand all':'Collapse all';
  }

  setSize(60);
</script>
</body>
</html>
